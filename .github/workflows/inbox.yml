name: jira-inbox

# Open an issue in this repo:
#   - Your own tasks, one per line:      Finish DB lab report | 2h | fri
#                                         done PER-42
#   - Title starting with "setup":       describe yourself in the body (uni, courses with short
#                                         names, projects, a normal week) and Gemini writes tasks.json.
# It replies with what it did and closes the issue.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: jira-autopilot
  cancel-in-progress: false

jobs:
  add:
    # Only your own issues count. Anyone else's are ignored, which matters on a public repo.
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Add tasks to Jira, or write tasks.json
        env:
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_PROJECT: ${{ vars.JIRA_PROJECT || secrets.JIRA_PROJECT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INBOX_RESULT: ${{ runner.temp }}/inbox.md
        run: |
          if printf '%s' "$ISSUE_TITLE" | grep -qiE '^[[:space:]]*(setup|about me)'; then
            python3 autopilot.py setup
          else
            python3 autopilot.py inbox
          fi
      - name: Save tasks.json
        if: success()
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -n "$(git status --porcelain tasks.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tasks.json
            git commit -m "Personal task list from issue #$NUMBER"
            git push
          fi
      - name: Reply and close
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ runner.temp }}/inbox.md
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$(cat "$RESULT")"
      - name: Reply on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Could not do this. Open the jira-inbox run in the Actions tab to see why."
